name: release-image
# Multi-arch image (native amd64 + arm64 runners) pushed to Docker Hub on a release (or by hand).
# DOCKER_USERNAME / DOCKER_PASSWORD are organization secrets of sctg-development.
permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    uses: sctg-development/build-multi-arch-docker-action/.github/workflows/build.yml@v2
    with:
      dockerfile: Dockerfile
      context: .
      image: sctg/stepca-ui
      # docker/metadata-action adds `latest` by itself for type=semver of a non-prerelease tag (and the action has
      # no `flavor` input): no explicit `latest` here, so that it never moves for a pre-release or a manual run.
      # The chart expects the tag without the leading `v` (release v1.0.0 -> 1.0.0).
      tags: |
        type=semver,pattern={{version}}
        type=ref,event=branch
      build-args: |
        APP_VERSION=${{ github.event.release.tag_name || github.ref_name }}
        GIT_SHA=${{ github.sha }}
        BUILD_DATE=${{ github.event.release.published_at || github.event.repository.updated_at }}
      artifact-prefix: stepca-ui-${{ github.run_id }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
